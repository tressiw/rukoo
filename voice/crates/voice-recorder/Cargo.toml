[package]
name = "voice-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rukoo-voice-recorder"
path = "src/main.rs"

# The recorder captures and writes to disk, nothing else, so it stays small and crash-isolated:
# no async runtime, no SQLite, no network beyond its own control port on 127.0.0.1.
[dependencies]
voice-audio = { path = "../voice-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Device capture runs on Windows and macOS through cpal. An input stream on an output device is
# WASAPI loopback on Windows and a Core Audio process tap on macOS. Elsewhere only the synthetic
# and file test sources run.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "=0.18.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_WindowsProgramming",
] }

# Core Audio, for what cpal 0.18.2 doesn't tell: a Mac without a microphone, which apps play sound,
# and a process tap of an output device that also has inputs. The objc2 versions are the ones
# cpal, Tauri and the other Voice crates already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-core-audio = { version = "=0.3.2", default-features = false, features = [
  "std",
  "AudioHardware",
  "objc2",
  "objc2-foundation",
] }
objc2-core-foundation = "=0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSUUID",
  "NSValue",
] }

# `flock`, which keeps a second recorder off a meeting's files.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hound = "=3.5.1"
