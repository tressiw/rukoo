[package]
name = "voice-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
voice-audio = { path = "../voice-audio" }
voice-bridge = { path = "../voice-bridge" }
voice-core = { path = "../voice-core" }
voice-input = { path = "../voice-input" }
voice-meetings = { path = "../voice-meetings" }
voice-protocol = { path = "../voice-protocol" }
voice-recorder = { path = "../voice-recorder" }
voice-screen-files = { path = "../voice-screen-files" }
voice-sync = { path = "../voice-sync" }
base64 = "0.22"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone capture, autostart and the Ownkey check are Windows-only in 0.1, as in the recorder;
# elsewhere they report that the platform isn't supported. The theme, the language, the chime and
# the free-space check read macOS' own settings through objc2.
[target.'cfg(windows)'.dependencies]
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The objc2 versions tauri 2.12.5, tao 0.37.2 and wry 0.57.1 pull in, so Voice shares one set of
# bindings with its own windows.
libc = "0.2"
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = [
  "std",
  "AudioServices",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSLocale",
  "NSString",
  "NSUserDefaults",
] }

[dev-dependencies]
# The screen tests run the screen process from their own test binary, as the controller tests run
# the recorder.
voice-screen = { path = "../voice-screen" }
voice-s3-fake = { path = "../voice-s3-fake" }

# The controller tests run the recorder from this test binary (it calls the same
# `voice_recorder::run` as `rukoo-voice-recorder`), so the test needs its own main.
[[test]]
name = "controller"
harness = false

# The same, for meetings through the whole engine: the pill, dictation during a meeting, retention.
[[test]]
name = "meetings"
harness = false

# The screen supervisor, `frame.get`, `clip.get` and the start handshake: this test binary is also
# the recorder and the screen process.
[[test]]
name = "screen"
harness = false

# Sync through the whole engine against the real recorder and the fake bucket.
[[test]]
name = "sync"
harness = false
